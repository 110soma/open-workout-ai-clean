name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Keep testing GitHub's synthetic merge tree, including the public-file audit.
      - run: npm test && npm run build && npm run test:e2e && npm run audit:public
      # Audit every actual branch/tag from a separate full-history checkout.
      # PR merge-ref metadata is generated by GitHub, not a proposed public commit.
      - name: Check out publishable history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: publishable-history
      - name: Audit all publishable Git history
        working-directory: publishable-history
        run: node scripts/git-history-audit.mjs
